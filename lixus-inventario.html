/* ============================================================
   DIÁLOGOS PROPIOS (reemplazan confirm() y prompt() del navegador)
   ============================================================ */
function dialogo({ titulo, mensaje, confirmar = 'Aceptar', cancelar = 'Cancelar', peligro = false, campo = null }){
  return new Promise(resolve => {
    const root = document.getElementById('dialogo');
    if(!root){ resolve(campo ? window.prompt(titulo, campo.valor || '') : window.confirm(mensaje || titulo)); return; }
    root.innerHTML = `
      <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" ${mensaje ? 'aria-describedby="dlgM"' : ''}>
        <h3 id="dlgT">${esc(titulo)}</h3>
        ${mensaje ? `<p id="dlgM">${esc(mensaje)}</p>` : ''}
        ${campo ? `<div class="field"><label for="dlgInput">${esc(campo.etiqueta)}</label><input id="dlgInput" type="${campo.tipo || 'text'}" value="${esc(campo.valor ?? '')}" ${campo.tipo === 'number' ? 'min="0" inputmode="numeric"' : ''} autocomplete="off"></div>` : ''}
        <div class="dlg-actions">
          <button type="button" class="btn btn-ghost" data-dlg="no">${esc(cancelar)}</button>
          <button type="button" class="btn ${peligro ? 'btn-peligro' : 'btn-primary'}" data-dlg="si">${esc(confirmar)}</button>
        </div>
      </div>`;
    root.classList.add('abierto');
    const previo = document.activeElement;
    const input = root.querySelector('#dlgInput');
    setTimeout(() => { (input || root.querySelector('[data-dlg="si"]')).focus(); if(input) input.select(); }, 20);
    const respuesta = (ok) => campo ? (ok ? input.value : null) : ok;
    const cerrar = (ok) => {
      root.classList.remove('abierto');
      root.innerHTML = '';
      root.onclick = null;
      document.removeEventListener('keydown', tecla, true);
      try{ if(previo && previo.focus) previo.focus(); }catch(e){}
      resolve(ok);
    };
    const tecla = (e) => {
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); cerrar(respuesta(false)); }
      else if(e.key === 'Enter' && e.target && e.target.id === 'dlgInput'){ e.preventDefault(); cerrar(respuesta(true)); }
    };
    root.onclick = (e) => {
      const b = e.target.closest('[data-dlg]');
      if(b) cerrar(respuesta(b.dataset.dlg === 'si'));
      else if(e.target === root) cerrar(respuesta(false));
    };
    document.addEventListener('keydown', tecla, true);
  });
}
function confirmar(titulo, mensaje, opciones){ return dialogo(Object.assign({ titulo, mensaje }, opciones || {})); }
function pedirValor(titulo, etiqueta, valor, opciones){ return dialogo(Object.assign({ titulo, campo:{ etiqueta, valor, tipo:(opciones||{}).tipo } }, opciones || {})); }

/* ============================================================
   ESCÁNER DE CÓDIGO DE BARRAS (cámara del celular)
   ============================================================ */
let ultimoCodigo = { valor:'', momento:0 };

function abrirEscaner(destino){
  if(typeof Html5Qrcode === 'undefined'){
    toast('El lector no cargó. Revisa tu conexión y recarga la página.','error');
    return;
  }
  const capa = document.getElementById('capaEscaner');
  capa.innerHTML = modalEscaner(destino).replace('class="modal-overlay"', 'class="modal-overlay anima"');
  document.body.classList.add('bloqueado');
  // El lector necesita que el contenedor ya exista en pantalla
  setTimeout(() => iniciarLector(destino), 60);
}

async function iniciarLector(destino){
  const cont = document.getElementById('lectorCodigo');
  if(!cont) return;
  try{
    const lector = new Html5Qrcode('lectorCodigo', { verbose:false });
    state.escaner = lector;
    await lector.start(
      { facingMode: 'environment' },           // cámara trasera
      { fps: 10, qrbox: { width: 260, height: 160 } },
      (codigo) => manejarCodigo(codigo, destino),
      () => {}                                  // ignora los cuadros sin código
    );
  }catch(err){
    console.error(err);
    const aviso = document.getElementById('avisoEscaner');
    if(aviso){
      aviso.innerHTML = 'No se pudo abrir la cámara. Revisa que le hayas dado permiso al navegador y que estés entrando por <strong>https</strong>.';
      aviso.className = 'alert-banner';
    }
  }
}

function manejarCodigo(codigo, destino){
  const ahora = Date.now();
  // Evita que el mismo código se registre muchas veces por segundo
  if(codigo === ultimoCodigo.valor && ahora - ultimoCodigo.momento < 1800) return;
  ultimoCodigo = { valor: codigo, momento: ahora };

  if(destino === 'sku'){
    const campo = document.querySelector('#formProducto input[name="sku"]');
    if(campo) campo.value = codigo;
    cerrarEscaner();
    toast('Código capturado: ' + codigo, 'success');
    return;
  }

  const p = productoPorCodigo(codigo);
  if(!p){
    pitido(false);
    const aviso = document.getElementById('avisoEscaner');
    if(aviso){
      aviso.className = 'alert-banner';
      aviso.innerHTML = `Ningún producto tiene el código <strong>${esc(codigo)}</strong>. Puedes agregárselo editando el producto en el campo SKU.`;
    }
    return;
  }
  if(Number(p.stock_actual) <= 0){
    pitido(false);
    toast(`${p.nombre} está sin stock.`,'error');
    return;
  }
  agregarAlCarrito(p.id);   // vuelve a dibujar la pantalla
  pitido(true);
  setTimeout(() => {
    const aviso = document.getElementById('avisoEscaner');
    if(aviso){
      aviso.className = 'alert-banner';
      aviso.style.background = 'var(--success-dim)';
      aviso.style.borderColor = 'var(--success)';
      aviso.style.color = 'var(--success)';
      aviso.textContent = `Agregado: ${p.nombre}`;
    }
  }, 50);
}

function productoPorCodigo(codigo){
  const c = String(codigo).trim().toLowerCase();
  return state.productos.find(p => (p.sku||'').trim().toLowerCase() === c && p.estado === 'activo');
}

/* Pitido corto de confirmación, sin archivos de sonido */
function pitido(ok){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), vol = ctx.createGain();
    osc.frequency.value = ok ? 880 : 240;
    vol.gain.value = 0.06;
    osc.connect(vol); vol.connect(ctx.destination);
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, ok ? 110 : 220);
  }catch(e){ /* si el navegador no deja sonar, no pasa nada */ }
}

async function cerrarEscaner(){
  const lector = state.escaner;
  state.escaner = null;
  if(lector){
    try{ await lector.stop(); lector.clear(); }catch(e){ /* ya estaba detenido */ }
  }
  const capa = document.getElementById('capaEscaner');
  if(capa) capa.innerHTML = '';
  document.body.classList.toggle('bloqueado', !!(state.modal || state.imagenVista || state.menuAbierto));
}

function modalEscaner(destino){
  const texto = destino === 'sku'
    ? 'Apunta al código de barras del producto para copiarlo al campo SKU.'
    : 'Apunta al código de barras. Cada producto reconocido se agrega a la venta.';
  return `
  <div class="modal-overlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="tituloEscaner">
      <div class="modal-head">
        <div><h3 id="tituloEscaner">Escanear código</h3><p class="modal-sub">${texto}</p></div>
        <button class="btn btn-icon btn-sm" data-action="cerrar-escaner" aria-label="Cerrar">${ic('x')}</button>
      </div>
      <div class="modal-body">
        <div id="lectorCodigo"></div>
        <div id="avisoEscaner" class="hint" style="margin-top:12px;" aria-live="polite">Buscando código…</div>
        <button type="button" class="btn btn-primary btn-full mt16" data-action="cerrar-escaner">Listo</button>
      </div>
    </div>
  </div>`;
}

let eventoInstalacion = null;

function prepararInstalacion(){
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    eventoInstalacion = e;
    state.puedeInstalar = true;
    render();
  });
  window.addEventListener('appinstalled', () => {
    eventoInstalacion = null;
    state.puedeInstalar = false;
    toast('App instalada. Ya puedes abrirla desde la pantalla de inicio.','success');
    render();
  });
}

async function instalarApp(){
  if(!eventoInstalacion){
    toast('Usa el menú del navegador y elige "Instalar app" o "Agregar a pantalla de inicio".','error');
    return;
  }
  eventoInstalacion.prompt();
  const { outcome } = await eventoInstalacion.userChoice;
  eventoInstalacion = null;
  state.puedeInstalar = false;
  if(outcome !== 'accepted') toast('Puedes instalarla más tarde desde el menú del navegador.','error');
  render();
}

  if(!puedeGestionarProductos()){ toast('Solo el administrador puede cambiar el stock.','error'); return; }
  const fd = new FormData(form);
  const id = fd.get('producto_id');
  const p = productoPorId(id);
  if(!p){ toast('Producto no encontrado.','error'); return; }
  const nuevo = Number(fd.get('stock_nuevo'));
  const motivo = (fd.get('motivo')||'').trim();
  if(isNaN(nuevo) || nuevo < 0){ toast('Escribe una cantidad válida.','error'); return; }
  if(!motivo){ toast('Escribe el motivo del cambio.','error'); return; }
  const viejo = Number(p.stock_actual)||0;
  if(nuevo === viejo){ toast('El stock no cambió.','error'); return; }
  try{
    const { error } = await supa.from('productos').update({ stock_actual: nuevo }).eq('id', id);
    if(error) throw error;
    await supa.from('movimientos_inventario').insert({
      producto_id: id, tipo:'ajuste',
      cantidad: nuevo - viejo, stock_resultante: nuevo,
      motivo: motivo, usuario: nombreUsuarioActual()
    });
    toast(`Stock de ${p.nombre}: ${fmtNum(viejo)} → ${fmtNum(nuevo)}.`,'success');
    state.modal = null;
    await cargarDatos();
  }catch(err){
    console.error(err);
    toast('No se pudo actualizar el stock.','error');
  }
}

function sugerirPrecioVenta(){
  const costo = Number($('#campoCosto').value)||0;

}

   ACCIONES: PRODUCTOS
   ============================================================ */
async function guardarProducto(form){
  if(!puedeGestionarProductos()){ toast('Solo el administrador puede cambiar productos.','error'); return; }
  const fd = new FormData(form);
  const id = state.modal.id;
  const datos = {
    nombre: fd.get('nombre').trim(),
    sku: fd.get('sku').trim() || null,
    categoria_id: fd.get('categoria_id') || null,
    proveedor_id: fd.get('proveedor_id') || null,
    costo: Number(fd.get('costo'))||0,
    precio_venta: Number(fd.get('precio_venta'))||0,
    stock_minimo: Number(fd.get('stock_minimo'))||0,
    unidad: fd.get('unidad').trim() || 'unidad',
    estado: fd.get('estado'),
    notas: fd.get('notas').trim() || null,
  };
  if(!datos.nombre){ toast('El nombre es obligatorio.','error'); return; }

  const archivoInput = $('#campoImagenProducto');
  if(archivoInput && archivoInput.files && archivoInput.files[0]){
    const url = await subirImagen(archivoInput.files[0]);
    if(url) datos.imagen_url = url;
  }

  try{
    if(id){
      // Si el administrador cambió el stock a mano, se guarda el ajuste en el kardex
      const actual = productoPorId(id);
      const stockNuevo = Number(fd.get('stock_actual'));
      const stockViejo = Number(actual?.stock_actual ?? 0);
      const cambioStock = !isNaN(stockNuevo) && stockNuevo !== stockViejo;
      if(cambioStock) datos.stock_actual = stockNuevo;

      const { error } = await supa.from('productos').update(datos).eq('id', id);
      if(error) throw error;

      if(cambioStock){
        await supa.from('movimientos_inventario').insert({
          producto_id: id, tipo:'ajuste',
          cantidad: stockNuevo - stockViejo,
          stock_resultante: stockNuevo,
          motivo:`Ajuste manual desde la ficha del producto (${fmtNum(stockViejo)} → ${fmtNum(stockNuevo)})`,
          usuario: nombreUsuarioActual()
        });
      }
      toast(cambioStock ? `Producto actualizado · stock ${fmtNum(stockViejo)} → ${fmtNum(stockNuevo)}.` : 'Producto actualizado.','success');
    } else {
      datos.stock_actual = Number(fd.get('stock_actual'))||0;
      const { data, error } = await supa.from('productos').insert(datos).select().single();
      if(error) throw error;
      if(datos.stock_actual > 0){
        await supa.from('movimientos_inventario').insert({
          producto_id: data.id, tipo:'entrada', cantidad: datos.stock_actual, stock_resultante: datos.stock_actual,
          motivo:'Stock inicial', usuario: nombreUsuarioActual()
        });
      }
      toast('Producto creado.','success');
    }
    state.modal = null;
    await cargarDatos();
  }catch(err){
    console.error(err);
    toast('No se pudo guardar el producto.','error');
  }
}

async function agregarCategoriaRapida(){
  if(!puedeGestionarProductos()){ toast('Solo el administrador puede crear categorías.','error'); return; }
  const nombre = await pedirValor('Nueva categoría', 'Nombre de la categoría', '', { confirmar:'Crear' });
  if(!nombre || !nombre.trim()) return;
  const limpio = nombre.trim();
  // Evita duplicados: si ya existe, la deja seleccionada en vez de crearla otra vez
  const existente = state.categorias.find(c => (c.nombre||'').trim().toLowerCase() === limpio.toLowerCase());
  if(existente){
    const select = document.querySelector('#formProducto select[name="categoria_id"]');
    if(select) select.value = existente.id;
    toast(`Ya existe "${existente.nombre}". Quedó seleccionada.`,'success');
    return;
  }
  try{
    const { data, error } = await supa.from('categorias').insert({ nombre: limpio }).select().single();
    if(error) throw error;
    state.categorias.push(data);
    state.categorias.sort((a,b) => a.nombre.localeCompare(b.nombre));
    const select = document.querySelector('#formProducto select[name="categoria_id"]');
    if(select){
      const opt = document.createElement('option');
      opt.value = data.id; opt.textContent = data.nombre; opt.selected = true;
      select.appendChild(opt);
    }
    toast('Categoría creada.','success');
  }catch(err){
    console.error(err);
    toast('No se pudo crear la categoría.','error');
  }
}

/* Elimina una categoría. Sus productos no se borran: quedan sin categoría. */
async function eliminarCategoria(id){
  if(!puedeGestionarProductos()){ toast('Solo el administrador puede eliminar categorías.','error'); return; }
  const cat = state.categorias.find(c => c.id === id);
  if(!cat) return;
  const n = state.productos.filter(p => p.categoria_id === id).length;
  const aviso = n
    ? `¿Eliminar la categoría "${cat.nombre}"? Sus ${n} producto${n===1?'':'s'} quedarán sin categoría. Los productos no se borran.`
    : `¿Eliminar la categoría "${cat.nombre}"?`;
  if(!await confirmar('Eliminar categoría', aviso, { confirmar:'Eliminar', peligro:true })) return;
  try{
    if(n){
      const r = await supa.from('productos').update({ categoria_id: null }).eq('categoria_id', id);
      if(r.error) throw r.error;
    }
    const { error } = await supa.from('categorias').delete().eq('id', id);
    if(error) throw error;
    toast(`Categoría "${cat.nombre}" eliminada.`,'success');
    await cargarDatos();
    // Si el formulario de producto está abierto, quita la opción sin perder lo que se escribió
    document.querySelectorAll('#formProducto select[name="categoria_id"] option').forEach(o => { if(o.value === id) o.remove(); });
    if(state.modal && state.modal.tipo === 'categorias') render();
  }catch(err){
    console.error(err);
    toast('No se pudo eliminar la categoría.','error');
  }
}

async function subirImagen(file){
  try{
    const ruta = `productos/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const { error } = await supa.storage.from(BUCKET_ARCHIVOS).upload(ruta, file, { upsert:true });
    if(error) throw error;
    const { data } = supa.storage.from(BUCKET_ARCHIVOS).getPublicUrl(ruta);
    return data.publicUrl;
  }catch(err){
    console.error(err);
    toast('No se pudo subir la imagen, se guardará el producto sin foto.','error');
    return null;
  }
}

function agregarAlCarrito(productoId){
  const p = productoPorId(productoId);
  if(!p) return;
  const existente = state.carrito.find(l=>l.producto_id===productoId);
  const enCarrito = existente ? existente.cantidad : 0;
  if(enCarrito + 1 > Number(p.stock_actual)){ toast('No hay suficiente stock disponible.','error'); return; }
  if(existente){ existente.cantidad += 1; }
  else{ state.carrito.push({ producto_id:p.id, nombre:p.nombre, precio_unitario:Number(p.precio_venta), costo_unitario:Number(p.costo), cantidad:1 }); }
  render();
}
async function agregarInstalacionCarrito(){
  const val = await pedirValor('Agregar instalación', 'Valor del servicio (COP)', '', { tipo:'number', confirmar:'Agregar' });
  if(val === null || String(val).trim() === '') return;
  const precio = Number(val);
  if(isNaN(precio) || precio < 0){ toast('Ingresa un valor numérico válido.','error'); return; }
  state.carrito.push({ producto_id:null, nombre:'Instalación', precio_unitario:precio, costo_unitario:0, cantidad:1 });
  render();
}
function cambiarCantidadCarrito(idx, delta){
  const linea = state.carrito[idx];
  if(!linea) return;
  const p = productoPorId(linea.producto_id);
  const nueva = linea.cantidad + delta;
  if(nueva <= 0){ state.carrito.splice(idx,1); render(); return; }
  if(p && nueva > Number(p.stock_actual)){ toast('No hay suficiente stock disponible.','error'); return; }
  linea.cantidad = nueva;
  render();
}
function quitarDelCarrito(idx){ state.carrito.splice(idx,1); render(); }

function nombreUsuarioActual(){
  if(state.modo==='admin') return state.vendedorNombre || 'Administrador';
  if(state.modo==='vendedor') return state.vendedorNombre || 'Vendedor';
  return 'Socio';
}

async function confirmarVenta(){
  if(!state.carrito.length){ toast('El carrito está vacío.','error'); return; }
  const subtotal = state.carrito.reduce((s,l)=>s+l.cantidad*l.precio_unitario,0);
  const descuento = Number(state.ventaForm.descuento)||0;
  const base = Math.max(0, subtotal-descuento);
  const ivaAplica = state.ajustes.iva_aplica === 'true';
  const ivaPct = Number(state.ajustes.iva_porcentaje)||0;
  const impuestos = ivaAplica ? Math.round(base * ivaPct/100) : 0;
  const total = base + impuestos;
  const costoTotal = state.carrito.reduce((s,l)=>s+l.cantidad*l.costo_unitario,0);
  const ganancia = base - costoTotal;

  try{
    for(const linea of state.carrito){
      if(!linea.producto_id) continue; // servicios como "Instalación" no afectan stock
      const p = productoPorId(linea.producto_id);
      if(!p || Number(p.stock_actual) < linea.cantidad){
        toast(`Stock insuficiente para ${linea.nombre}.`,'error');
        return;
      }
    }

    // Cliente opcional: si se escribió un nombre, se busca o se crea en Clientes automáticamente
    let clienteId = null;
    const nombreCliente = (state.ventaForm.cliente_nombre||'').trim();
    const telCliente = (state.ventaForm.cliente_telefono||'').trim();
    if(nombreCliente){
      const existente = state.clientes.find(c => (c.nombre||'').trim().toLowerCase() === nombreCliente.toLowerCase());
      if(existente){
        clienteId = existente.id;
        if(telCliente && !existente.telefono){
          await supa.from('clientes').update({ telefono: telCliente }).eq('id', existente.id);
        }
      }else{
        const { data: nuevoCliente, error: errCli } = await supa.from('clientes')
          .insert({ nombre: nombreCliente, telefono: telCliente || null }).select().single();
        if(!errCli && nuevoCliente) clienteId = nuevoCliente.id;
      }
    }

    const { data: venta, error: errV } = await supa.from('ventas').insert({
      cliente_nombre: nombreCliente || null,
      cliente_id: clienteId,
      vendedor: nombreUsuarioActual(),
      metodo_pago: state.ventaForm.metodo_pago,
      incluye_garantia: !!state.ventaForm.incluir_garantia,
      subtotal, descuento, impuestos, total, costo_total: costoTotal, ganancia, estado:'completada'
    }).select().single();
    if(errV) throw errV;

    for(const linea of state.carrito){
      await supa.from('venta_items').insert({
        venta_id: venta.id, producto_id: linea.producto_id, producto_nombre: linea.nombre,
        cantidad: linea.cantidad, precio_unitario: linea.precio_unitario, costo_unitario: linea.costo_unitario,
        subtotal: linea.cantidad*linea.precio_unitario
      });
      if(!linea.producto_id) continue; // servicios como "Instalación": sin stock que ajustar
      const p = productoPorId(linea.producto_id);
      const nuevoStock = Number(p.stock_actual) - linea.cantidad;
      await supa.from('productos').update({ stock_actual: nuevoStock }).eq('id', linea.producto_id);
      await supa.from('movimientos_inventario').insert({
        producto_id: linea.producto_id, tipo:'venta', cantidad: -linea.cantidad, stock_resultante: nuevoStock,
        referencia: `Venta #${venta.numero_venta}`, venta_id: venta.id, usuario: nombreUsuarioActual()
      });
    }
    toast(`Venta #${venta.numero_venta} registrada por ${fmtMoney(total)}.`,'success');
    state.carrito = [];
    state.ventaForm = { cliente_nombre:'', cliente_telefono:'', cliente_id:'', metodo_pago:'efectivo', descuento:0, notas:'', incluir_garantia:false };
    await cargarDatos();
  }catch(err){
    console.error(err);
    toast('No se pudo registrar la venta.','error');
  }
}

async function anularVenta(id){
  if(!await confirmar('Anular venta', 'El stock de los productos se repondrá y la venta quedará marcada como anulada.', { confirmar:'Anular venta', peligro:true })) return;
  try{
    const venta = state.ventas.find(v=>v.id===id);
    const items = state.ventaItems.filter(it=>it.venta_id===id);
    for(const it of items){
      const p = productoPorId(it.producto_id);
      if(!p) continue;
      const nuevoStock = Number(p.stock_actual) + Number(it.cantidad);
      await supa.from('productos').update({ stock_actual: nuevoStock }).eq('id', p.id);
      await supa.from('movimientos_inventario').insert({
        producto_id: p.id, tipo:'devolucion', cantidad: Number(it.cantidad), stock_resultante: nuevoStock,
        referencia: `Anulación venta #${venta ? venta.numero_venta : ''}`, venta_id: id, usuario: nombreUsuarioActual()
      });
    }
    await supa.from('ventas').update({ estado:'anulada' }).eq('id', id);
    toast('Venta anulada y stock repuesto.','success');
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudo anular la venta.','error'); }
}

async function registrarEntrada(form){
  if(!puedeGestionarProductos()){ toast('Solo el administrador puede registrar movimientos.','error'); return; }
  const fd = new FormData(form);
  const productoId = fd.get('producto_id');
  const cantidad = Number(fd.get('cantidad'))||0;
  const costoUnitario = fd.get('costo_unitario') ? Number(fd.get('costo_unitario')) : null;
  const actualizarCosto = fd.get('actualizar_costo') === 'on';
  const referencia = fd.get('referencia').trim() || null;
  if(cantidad <= 0){ toast('La cantidad debe ser mayor a 0.','error'); return; }
  const p = productoPorId(productoId);
  if(!p) return;
  try{
    const nuevoStock = Number(p.stock_actual) + cantidad;
    const cambios = { stock_actual: nuevoStock };
    if(actualizarCosto && costoUnitario !== null) cambios.costo = costoUnitario;
    await supa.from('productos').update(cambios).eq('id', productoId);
    await supa.from('movimientos_inventario').insert({
      producto_id: productoId, tipo:'entrada', cantidad, stock_resultante: nuevoStock,
      motivo:'Compra a proveedor', referencia, proveedor_id: p.proveedor_id || null,
      costo_unitario: costoUnitario, usuario: nombreUsuarioActual()
    });
    toast('Entrada registrada.','success');
    state.modal = null;
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudo registrar la entrada.','error'); }
}

async function registrarAjuste(form){
  if(!puedeGestionarProductos()){ toast('Solo el administrador puede registrar movimientos.','error'); return; }
  const fd = new FormData(form);
  const productoId = fd.get('producto_id');
  const tipo = fd.get('tipo');
  const cantidad = Number(fd.get('cantidad'))||0;
  const motivo = fd.get('motivo').trim();
  if(cantidad <= 0){ toast('La cantidad debe ser mayor a 0.','error'); return; }
  if(!motivo){ toast('El motivo es obligatorio.','error'); return; }
  const p = productoPorId(productoId);
  if(!p) return;
  const nuevoStock = Math.max(0, Number(p.stock_actual) - cantidad);
  try{
    await supa.from('productos').update({ stock_actual: nuevoStock }).eq('id', productoId);
    await supa.from('movimientos_inventario').insert({
      producto_id: productoId, tipo, cantidad: -cantidad, stock_resultante: nuevoStock, motivo, usuario: nombreUsuarioActual()
    });
    toast('Movimiento registrado.','success');
    state.modal = null;
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudo registrar el movimiento.','error'); }
}

async function guardarAjustesNegocio(form){
  const fd = new FormData(form);
  const claves = ['nombre_empresa','moneda','margen_sugerido_global','umbral_stock_bajo','iva_porcentaje'];
  try{
    for(const k of claves){
      await supa.from('ajustes').upsert({ key:k, value: String(fd.get(k)||'') });
    }
    await supa.from('ajustes').upsert({ key:'iva_aplica', value: fd.get('iva_aplica')==='on' ? 'true' : 'false' });
    toast('Ajustes guardados.','success');
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudieron guardar los ajustes.','error'); }
}

    clientes: state.clientes, ventas: state.ventas, venta_items: state.ventaItems,
    movimientos_inventario: state.movimientos, ajustes: state.ajustes
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `lixus-backup-${hoyISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exportado.','success');
}

async function importarBackup(file){
  if(!file) return;
  if(!await confirmar('Importar backup', 'Los datos actuales se reemplazarán por los del archivo. ¿Continuar?', { confirmar:'Importar', peligro:true })) return;
  try{
    const texto = await file.text();
    const data = JSON.parse(texto);
    const tablas = ['categorias','proveedores','productos','clientes','ventas','venta_items','movimientos_inventario'];
    for(const t of tablas){
      if(Array.isArray(data[t]) && data[t].length){
        await supa.from(t).upsert(data[t]);
      }
    }
    toast('Backup importado correctamente.','success');
    await cargarDatos();
  }catch(err){ console.error(err); toast('El archivo no es un backup válido.','error'); }
}

/* ============================================================
   DELEGACIÓN DE EVENTOS
   ============================================================ */
function cerrarModal(){ state.modal = null; render(); }

document.addEventListener('DOMContentLoaded', () => {
  const app = $('#app');

  app.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const accion = btn.dataset.action;
    const id = btn.dataset.id;

    const SOLO_ADMIN = ['nuevo-producto','editar-producto','cambiar-stock','eliminar-producto','escanear-sku',
                        'nueva-categoria','abrir-categorias','eliminar-categoria','eliminar-categoria-seleccionada',
                        'nueva-entrada','nuevo-ajuste','reponer'];
    if(SOLO_ADMIN.includes(accion) && !puedeGestionarProductos()){
      toast('Solo el administrador puede cambiar productos y categorías.','error');
      return;
    }

    if(accion==='ir-tab'){ const cambio = state.tab !== id; state.tab = id; state.ventaExpandida=null; state.menuAbierto=false; render(); if(cambio) window.scrollTo(0,0); }
    else if(accion==='toggle-tema'){ state.tema = state.tema==='dark' ? 'light' : 'dark'; render(); }
    else if(accion==='recargar'){ cargarDatos(); }
    else if(accion==='cerrar-sesion'){ state.autenticado=false; state.carrito=[]; state.tab='dashboard'; state.menuAbierto=false; state.modal=null; render(); }
    else if(accion==='cerrar-modal'){ cerrarModal(); }
    else if(accion==='cerrar-modal-fondo'){ if(e.target===btn){ cerrarModal(); } }
    else if(accion==='nuevo-producto'){ state.modal={tipo:'producto', id:null}; render(); }
    else if(accion==='editar-producto'){ state.modal={tipo:'producto', id}; render(); }
    else if(accion==='nueva-categoria'){ agregarCategoriaRapida(); }
    else if(accion==='toggle-categoria'){ alternarCategoria(id); }
    else if(accion==='abrir-categorias'){ state.modal={tipo:'categorias'}; render(); }
    else if(accion==='eliminar-categoria'){ eliminarCategoria(id); }
    else if(accion==='eliminar-categoria-seleccionada'){ eliminarCategoriaSeleccionada(); }
    else if(accion==='filtro-categoria'){ state.filtros.productos.categoria = id || ''; render(); }
    else if(accion==='filtro-mov-tipo'){ state.filtros.movimientos.tipo = id || ''; render(); }
    else if(accion==='metodo-pago'){ state.ventaForm.metodo_pago = id; render(); }
    else if(accion==='vaciar-carrito'){ state.carrito = []; render(); }
    else if(accion==='abrir-menu'){ state.menuAbierto = true; render(); }
    else if(accion==='cerrar-menu'){ if(e.target===btn){ state.menuAbierto = false; render(); } }
    else if(accion==='reponer'){ state.modal = { tipo:'entrada', productoId:id }; render(); }
    else if(accion==='cambiar-acceso'){ state.modo = null; state.errorLogin = ''; render(); }
    else if(accion==='mas-ventas'){ state.limiteVentas += 25; render(); }
    else if(accion==='mas-mov'){ state.limiteMov += 50; render(); }
    else if(accion==='elegir-modo'){ state.modo = id; state.autenticado=false; render(); }
    else if(accion==='instalar-app'){ instalarApp(); }
    else if(accion==='abrir-escaner'){ abrirEscaner('venta'); }
    else if(accion==='escanear-sku'){ abrirEscaner('sku'); }
    else if(accion==='cerrar-escaner'){ cerrarEscaner(); }
    else if(accion==='ver-imagen'){ state.imagenVista = id; render(); }
    else if(accion==='cerrar-visor'){ if(e.target===btn || btn.classList.contains('lightbox-close')){ state.imagenVista = null; render(); } }
    else if(accion==='cambiar-stock'){ state.modal={tipo:'stock', id}; render(); }
    else if(accion==='ir-carrito'){
      const panel = document.getElementById('panelCarrito');
      if(panel) panel.scrollIntoView({behavior:'smooth', block:'start'});
    }
    else if(accion==='eliminar-producto'){ eliminarProducto(id); }
    else if(accion==='nuevo-proveedor'){ state.modal={tipo:'proveedor', id:null}; render(); }
    else if(accion==='editar-proveedor'){ state.modal={tipo:'proveedor', id}; render(); }
    else if(accion==='eliminar-proveedor'){ eliminarProveedor(id); }
    else if(accion==='nuevo-cliente'){ state.modal={tipo:'cliente', id:null}; render(); }
    else if(accion==='editar-cliente'){ state.modal={tipo:'cliente', id}; render(); }
    else if(accion==='eliminar-cliente'){ eliminarCliente(id); }
    else if(accion==='nueva-entrada'){ state.modal={tipo:'entrada'}; render(); }
    else if(accion==='nuevo-ajuste'){ state.modal={tipo:'ajuste'}; render(); }
    else if(accion==='agregar-carrito'){ agregarAlCarrito(id); }
    else if(accion==='agregar-instalacion'){ agregarInstalacionCarrito(); }
    else if(accion==='carrito-mas'){ cambiarCantidadCarrito(Number(id), 1); }
    else if(accion==='carrito-menos'){ cambiarCantidadCarrito(Number(id), -1); }
    else if(accion==='carrito-quitar'){ quitarDelCarrito(Number(id)); }
    else if(accion==='confirmar-venta'){ confirmarVenta(); }
    else if(accion==='generar-cotizacion'){ generarCotizacionImprimible(); }
    else if(accion==='generar-factura'){ generarFacturaImprimible(id); }
    else if(accion==='ver-venta'){ state.ventaExpandida = state.ventaExpandida===id ? null : id; render(); }
    else if(accion==='anular-venta'){ anularVenta(id); }
    else if(accion==='generar-reporte'){ generarReporteImprimible(); }
    else if(accion==='generar-reporte-mensual'){ generarReporteMensualImprimible(); }
    else if(accion==='generar-reporte-anual'){ generarReporteAnualImprimible(); }
    else if(accion==='exportar-backup'){ exportarBackup(); }
    else if(accion==='copiar-link'){
      navigator.clipboard.writeText(id).then(()=>toast('Link copiado.','success')).catch(()=>toast('No se pudo copiar.','error'));
    }
  });

  app.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    if(form.id === 'formLogin'){
      const pass = $('#inputPassword').value;
      if(pass) intentarLogin(pass);
    }
    else if(form.id === 'formNombreVendedor'){
      const nombre = $('#inputNombreVendedor').value.trim();
      state.vendedorNombre = nombre || (state.modo === 'admin' ? 'Administrador' : 'Vendedor');
      state.pidiendoNombreVendedor = false;
      render();
    }
    else if(form.id === 'formProducto') guardarProducto(form);
    else if(form.id === 'formProveedor') guardarProveedor(form);
    else if(form.id === 'formCliente') guardarCliente(form);
    else if(form.id === 'formEntrada') registrarEntrada(form);
    else if(form.id === 'formAjuste') registrarAjuste(form);
    else if(form.id === 'formStock') guardarStockRapido(form);
    else if(form.id === 'formNuevaCategoria') crearCategoria(form);
    else if(form.id === 'formAjustes') guardarAjustesNegocio(form);
  });

  app.addEventListener('input', (e) => {
    if(e.target.id === 'campoPrecioVenta'){ e.target.dataset.tocado = '1'; }
  });

  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    const dlg = document.getElementById('dialogo');
    if(dlg && dlg.classList.contains('abierto')) return;
    const capa = document.getElementById('capaEscaner');
    if(capa && capa.innerHTML){ cerrarEscaner(); return; }
    if(state.imagenVista){ state.imagenVista = null; render(); }
    else if(state.modal){ cerrarModal(); }
    else if(state.menuAbierto){ state.menuAbierto = false; render(); }
  });
  const capaEsc = document.getElementById('capaEscaner');
  if(capaEsc) capaEsc.addEventListener('click', (e) => {
    if(e.target.closest('[data-action="cerrar-escaner"]')) cerrarEscaner();
  });

  const favicon = document.createElement('link');
  favicon.rel = 'icon';
  favicon.href = LOGO_DATA_URI;
  document.head.appendChild(favicon);

  prepararInstalacion();

  // Service worker: permite abrir la app aunque falle la señal.
  // Solo funciona servido por https (GitHub Pages lo es).
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker no registrado:', err));
  }

  state.modo = detectarModo();
  render();
});
</script>
