<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lixus Company — Inventario y Ventas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07070a;
  --bg-glow:#0c1420;
  --bg2:#0b0c11;
  --panel:#101219;
  --panel2:#151824;
  --border:#232838;
  --border-soft:#1a1d29;
  --neon:#00e5ff;
  --neon2:#3b7bff;
  --neon-dim:rgba(0,229,255,.14);
  --neon-glow:0 0 20px rgba(0,229,255,.35);
  --white:#f4f6fb;
  --muted:#8a92a8;
  --danger:#ff5577;
  --danger-dim:rgba(255,85,119,.14);
  --success:#27e6ab;
  --success-dim:rgba(39,230,171,.14);
  --warning:#ffb020;
  --warning-dim:rgba(255,176,32,.14);
  --logo-filter:drop-shadow(0 0 10px rgba(0,229,255,.4));
  --radius:14px;
}
:root[data-theme="light"]{
  --bg:#f3f6fb;
  --bg-glow:#e3f0ff;
  --bg2:#ffffff;
  --panel:#ffffff;
  --panel2:#eef4fb;
  --border:#dbe3ee;
  --border-soft:#e8edf5;
  --neon:#0090ff;
  --neon2:#2f6bff;
  --neon-dim:rgba(0,144,255,.10);
  --neon-glow:0 0 16px rgba(0,144,255,.22);
  --white:#10131a;
  --muted:#5b6478;
  --danger:#d1304a;
  --danger-dim:rgba(209,48,74,.10);
  --success:#0f9d68;
  --success-dim:rgba(15,157,104,.10);
  --warning:#a8650a;
  --warning-dim:rgba(168,101,10,.10);
  --logo-filter:invert(1) drop-shadow(0 0 8px rgba(0,144,255,.25));
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, var(--bg) 45%) fixed;
  color:var(--white);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  transition:background-color .2s ease, color .2s ease;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--neon2);}
a{color:var(--neon);}
h1,h2,h3,h4{margin:0 0 4px;font-weight:700;letter-spacing:.2px;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.logo-mark{
  height:32px;width:auto;display:block;
  filter:var(--logo-filter);
}
.logo-mark-lg{height:120px;margin:0 auto 6px;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.center{display:flex;align-items:center;justify-content:center;}
.flex{display:flex;align-items:center;}
.gap8{gap:8px;}
.gap12{gap:12px;}
.gap16{gap:16px;}
.wrap{flex-wrap:wrap;}
.spacer{flex:1;}

/* ---------- layout shells ---------- */
.gate-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.gate-card{
  background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:36px 32px;max-width:400px;width:100%;
  box-shadow:0 0 0 1px rgba(0,229,255,.04), 0 30px 60px -20px rgba(0,0,0,.6);
}
.gate-card .logo{font-size:30px;margin-bottom:4px;}
.gate-sub{color:var(--muted);margin-bottom:26px;font-size:13.5px;}
.field{margin-bottom:14px;text-align:left;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],select,textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg2);color:var(--white);font-size:14.5px;outline:none;transition:.15s;
}
textarea{resize:vertical;min-height:70px;}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px var(--neon-dim);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);color:var(--white);font-size:14px;font-weight:600;
  transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--neon);color:var(--neon);}
.btn-primary{background:linear-gradient(135deg,var(--neon2),var(--neon));border:none;color:#00131a;box-shadow:var(--neon-glow);}
.btn-primary:hover{color:#00131a;filter:brightness(1.08);}
.btn-full{width:100%;}
.btn-danger{border-color:rgba(255,85,119,.4);color:var(--danger);}
.btn-danger:hover{border-color:var(--danger);background:var(--danger-dim);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--neon);background:var(--neon-dim);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn[disabled]{opacity:.5;pointer-events:none;}
.error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

/* ---------- app shell ---------- */
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(7,7,10,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);padding:12px 20px;display:flex;align-items:center;gap:18px;
}
.badge{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase;
  border:1px solid var(--border);color:var(--muted);
}
.badge-neon{color:var(--neon);border-color:rgba(0,229,255,.4);background:var(--neon-dim);}
.badge-success{color:var(--success);border-color:rgba(39,230,171,.4);background:var(--success-dim);}
.badge-warning{color:var(--warning);border-color:rgba(255,176,32,.4);background:var(--warning-dim);}
.badge-danger{color:var(--danger);border-color:rgba(255,85,119,.4);background:var(--danger-dim);}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--border-soft);}
.tab-btn{
  padding:9px 15px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);
  font-size:13.5px;font-weight:600;white-space:nowrap;
}
.tab-btn:hover{color:var(--white);}
.tab-btn.active{background:var(--neon-dim);color:var(--neon);border-color:rgba(0,229,255,.35);}
.page{padding:22px;max-width:1320px;margin:0 auto;}

/* ---------- cards / grid ---------- */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.card{
  background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;
}
.card .kpi-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.card .kpi-value{font-size:24px;font-weight:800;}
.card .kpi-sub{margin-top:6px;font-size:12px;color:var(--muted);}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.alert-banner{
  display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;margin-bottom:18px;
  background:var(--warning-dim);border:1px solid rgba(255,176,32,.35);color:#ffd27a;font-size:13.5px;
}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;}
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;height:300px;}
.chart-box canvas{max-height:240px;}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:hover td{background:rgba(0,229,255,.03);}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.filters-row > *{min-width:150px;flex:1;}
.filters-row .search-input{flex:2;min-width:200px;}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.pill-ok{background:var(--success-dim);color:var(--success);}
.pill-warn{background:var(--warning-dim);color:var(--warning);}
.pill-danger{background:var(--danger-dim);color:var(--danger);}
.pill-muted{background:var(--border-soft);color:var(--muted);}
.row-actions{display:flex;gap:6px;}
.prod-thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:var(--bg2);}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(2,2,4,.72);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.modal-box{background:linear-gradient(160deg,var(--panel2),var(--bg2));border:1px solid var(--border);border-radius:var(--radius);padding:26px;max-width:560px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);}
.modal-box.wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{font-size:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--neon);color:var(--white);
  padding:13px 16px;border-radius:10px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s;max-width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateY(0);}
.toast-error{border-left-color:var(--danger);}
.toast-success{border-left-color:var(--success);}

/* ---------- POS ---------- */
.pos-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:900px){.pos-grid{grid-template-columns:1fr;}}
.cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.cart-line .qty-box{display:flex;align-items:center;gap:6px;}
.qty-box button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--white);}
.total-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
.total-line.grand{font-size:20px;font-weight:800;color:var(--neon);border-top:1px solid var(--border);margin-top:8px;padding-top:12px;}

/* ---------- misc ---------- */
.loading-screen{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--neon);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.link-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;flex-wrap:wrap;}
.link-row code{flex:1;min-width:200px;color:var(--neon);word-break:break-all;font-size:12.5px;}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.checkbox-row input{width:auto;}
.divider{height:1px;background:var(--border-soft);margin:16px 0;}
</style>
</head>

/* ============================================================
   UTILIDADES
   ============================================================ */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function fmtMoney(n){
  n = Number(n)||0;
  const moneda = state.ajustes.moneda || 'COP';
  try{
    return new Intl.NumberFormat('es-CO', {style:'currency', currency: moneda, maximumFractionDigits:0}).format(n);
  }catch(e){
    return '$ ' + fmtNum(n);
  }
}
function fmtNum(n){ return new Intl.NumberFormat('es-CO').format(Number(n)||0); }
function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(d){
  if(!d) return '—';
  return new Date(d).toLocaleString('es-CO', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function inicioMesISO(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString(); }
async function sha256Hex(texto){
  const enc = new TextEncoder().encode(texto);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function toast(msg, tipo){
  const cont = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (tipo ? ' toast-'+tipo : '');
  el.textContent = msg;
  cont.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3800);
}
function margenSugeridoGlobal(){ return Number(state.ajustes.margen_sugerido_global) || 0; }
function stockBajoUmbral(p){ return Number(p.stock_minimo != null ? p.stock_minimo : state.ajustes.umbral_stock_bajo) || 0; }
function nombreCategoria(id){ const c = state.categorias.find(x=>x.id===id); return c ? c.nombre : '—'; }
function nombreProveedor(id){ const p = state.proveedores.find(x=>x.id===id); return p ? p.nombre : '—'; }
function productoPorId(id){ return state.productos.find(p=>p.id===id); }
function categoriaIdPorNombre(nombre){
  const c = state.categorias.find(c => (c.nombre||'').trim().toLowerCase() === nombre.trim().toLowerCase());
  return c ? c.id : null;
}
function itemsIncluyenCategoria(items, nombreCategoria){
  const catId = categoriaIdPorNombre(nombreCategoria);
  if(!catId) return false;
  return items.some(it => {
    if(!it.producto_id) return false;
    const p = productoPorId(it.producto_id);
    return p && p.categoria_id === catId;
  });
}

function baseUrl(){ return location.origin + location.pathname; }

/* ============================================================
   DETECCIÓN DE MODO POR URL
   ============================================================ */
function detectarModo(){
  const p = new URLSearchParams(location.search);
  if(p.get('admin') === '1') return 'admin';
  if(p.get('vendedor') === '1') return 'vendedor';
  if(p.get('vista') === 'socio') return 'socio';
  return null;
}

/* ============================================================
   CARGA DE DATOS
   ============================================================ */
async function cargarDatos(){
  state.cargando = true;
  if(!state.modal) render(); // no interrumpir un formulario abierto con datos sin guardar
  try{
    const [cat, prov, prod, cli, vt, vi, mov, cfg, ajs] = await Promise.all([
      supa.from('categorias').select('*').order('nombre'),
      supa.from('proveedores').select('*').order('nombre'),
      supa.from('productos').select('*').order('nombre'),
      supa.from('clientes').select('*').order('nombre'),
      supa.from('ventas').select('*').order('fecha', {ascending:false}).limit(800),
      supa.from('venta_items').select('*'),
      supa.from('movimientos_inventario').select('*').order('created_at', {ascending:false}).limit(800),
      supa.from('config').select('*'),
      supa.from('ajustes').select('*'),
    ]);
    state.categorias = cat.data || [];
    state.proveedores = prov.data || [];
    state.productos = prod.data || [];
    state.clientes = cli.data || [];
    state.ventas = vt.data || [];
    state.ventaItems = vi.data || [];
    state.movimientos = mov.data || [];
    state.config = Object.fromEntries((cfg.data||[]).map(r => [r.key, r.value]));
    state.ajustes = Object.fromEntries((ajs.data||[]).map(r => [r.key, r.value]));
  }catch(err){
    console.error(err);
    toast('No se pudieron cargar los datos. Revisa la conexión con Supabase.', 'error');
  }
  state.cargando = false;
  if(!state.modal) render(); // los datos ya quedaron actualizados en memoria; se pintan al cerrar el formulario
}

let refreshTimer = null;
function programarRecarga(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(cargarDatos, 500);
}
function activarTiempoReal(){
  const tablas = ['categorias','proveedores','productos','clientes','ventas','venta_items','movimientos_inventario','ajustes'];
  const canal = supa.channel('lixus-realtime');
  tablas.forEach(t => {
    canal.on('postgres_changes', {event:'*', schema:'public', table:t}, programarRecarga);
  });
  canal.subscribe();
}

/* ============================================================
   AUTENTICACIÓN
   ============================================================ */
async function intentarLogin(passwordPlano){
  state.autenticando = true; state.errorLogin=''; render();
  try{
    const claveConfig = state.modo === 'admin' ? 'admin_password_hash'
      : state.modo === 'vendedor' ? 'vendedor_password_hash'
      : 'socio_password_hash';
    const { data, error } = await supa.from('config').select('value').eq('key', claveConfig).single();
    if(error || !data){ throw new Error('no-config'); }
    const hash = await sha256Hex(passwordPlano);
    if(hash === data.value){
      state.autenticado = true;
      state.errorLogin = '';
      if(state.modo === 'vendedor' || state.modo === 'admin'){ state.pidiendoNombreVendedor = true; }
      await cargarDatos();
      activarTiempoReal();
    } else {
      state.errorLogin = 'Contraseña incorrecta. Intenta de nuevo.';
    }
  }catch(err){
    console.error(err);
    state.errorLogin = 'No se pudo verificar la contraseña. Revisa que SUPABASE_URL y SUPABASE_KEY estén configurados y que el script SQL se haya ejecutado.';
  }
  state.autenticando = false;
  render();
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render(){
  document.documentElement.setAttribute('data-theme', state.tema);
  const app = $('#app');
  if(!state.modo){ app.innerHTML = vistaSinAcceso(); return; }
  if(!state.autenticado){ app.innerHTML = vistaLogin(); return; }
  if(state.pidiendoNombreVendedor){ app.innerHTML = vistaNombreVendedor(); return; }
  if(state.cargando && !state.productos.length && !state.ventas.length){ app.innerHTML = vistaCargando(); return; }

  let html = '';
  if(state.modo === 'admin') html = vistaAdmin();
  else if(state.modo === 'vendedor') html = vistaVendedor();
  else if(state.modo === 'socio') html = vistaSocio();
  html += state.modal ? renderModal() : '';
  app.innerHTML = html;

  if(state.tab === 'dashboard' || state.tab === 'reportes' || state.modo === 'socio'){
    setTimeout(initCharts, 0);
  }
}

/* ---------- Dashboard ---------- */
function calcularMetricasDashboard(){
  const hoy = hoyISO();
  const inicioMes = inicioMesISO();
  const ventasValidas = state.ventas.filter(v => v.estado !== 'anulada');
  const ventasHoy = ventasValidas.filter(v => (v.fecha||'').slice(0,10) === hoy);
  const ventasMes = ventasValidas.filter(v => v.fecha >= inicioMes);
  const totalHoy = ventasHoy.reduce((s,v)=>s+Number(v.total||0),0);
  const totalMes = ventasMes.reduce((s,v)=>s+Number(v.total||0),0);
  const gananciaMes = ventasMes.reduce((s,v)=>s+Number(v.ganancia||0),0);
  const valorInventarioCosto = state.productos.reduce((s,p)=>s+Number(p.costo||0)*Number(p.stock_actual||0),0);
  const valorInventarioVenta = state.productos.reduce((s,p)=>s+Number(p.precio_venta||0)*Number(p.stock_actual||0),0);
  const stockBajo = state.productos.filter(p => p.estado==='activo' && Number(p.stock_actual||0) <= stockBajoUmbral(p));
  const productosActivos = state.productos.filter(p=>p.estado==='activo').length;
  return { ventasHoy, ventasMes, totalHoy, totalMes, gananciaMes, valorInventarioCosto, valorInventarioVenta, stockBajo, productosActivos };
}

function initCharts(){
  if(typeof Chart === 'undefined') return;
  Object.values(charts).forEach(c => { try{ c.destroy(); }catch(e){} });

  const esClaro = document.documentElement.getAttribute('data-theme') === 'light';
  const neon = esClaro ? '#0090ff' : '#00e5ff';
  const neon2 = esClaro ? '#2f6bff' : '#3b7bff';
  const white = esClaro ? '#10131a' : '#f4f6fb';
  const muted = esClaro ? '#5b6478' : '#8a92a8';
  const danger = esClaro ? '#d1304a' : '#ff5577';
  const success = esClaro ? '#0f9d68' : '#27e6ab';
  const warning = esClaro ? '#a8650a' : '#ffb020';
  const gridColor = esClaro ? 'rgba(10,20,40,.08)' : 'rgba(255,255,255,.06)';
  Chart.defaults.color = muted;
  Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

  const c14 = document.getElementById('chartVentas14');
  if(c14){
    const dias = [];
    const totales = [];
    for(let i=13;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = d.toISOString().slice(0,10);
      dias.push(d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit'}));
      const total = state.ventas.filter(v=>v.estado!=='anulada' && (v.fecha||'').slice(0,10)===iso).reduce((s,v)=>s+Number(v.total||0),0);
      totales.push(total);
    }
    charts.c14 = new Chart(c14, {type:'line', data:{labels:dias, datasets:[{label:'Ventas', data:totales, borderColor:neon, backgroundColor:'rgba(0,229,255,.15)', tension:.35, fill:true, pointRadius:2}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{grid:{color:gridColor}}, y:{grid:{color:gridColor}, beginAtZero:true}}}});
  }

  const cInv = document.getElementById('chartInvCategoria');
  if(cInv){
    const porCat = {};
    state.productos.forEach(p => {
      const nombre = nombreCategoria(p.categoria_id);
      porCat[nombre] = (porCat[nombre]||0) + Number(p.stock_actual||0);
    });
    const labels = Object.keys(porCat);
    charts.cInv = new Chart(cInv, {type:'doughnut', data:{labels, datasets:[{data:Object.values(porCat), backgroundColor:[neon,neon2,success,warning,danger,'#8a5cf6','#f472b6']}]},
      options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10}}}}});
  }

  const cTop = document.getElementById('chartTopProductos');
  if(cTop){
    const desde = new Date(); desde.setDate(desde.getDate()-30);
    const ventasRecientes = new Set(state.ventas.filter(v=>v.estado!=='anulada' && new Date(v.fecha) >= desde).map(v=>v.id));
    const cant = {};
    state.ventaItems.forEach(it => {
      if(!ventasRecientes.has(it.venta_id)) return;
      cant[it.producto_nombre] = (cant[it.producto_nombre]||0) + Number(it.cantidad||0);
    });
    const top = Object.entries(cant).sort((a,b)=>b[1]-a[1]).slice(0,5);
    charts.cTop = new Chart(cTop, {type:'bar', data:{labels:top.map(t=>t[0]), datasets:[{label:'Unidades', data:top.map(t=>t[1]), backgroundColor:neon}]},
      options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{grid:{color:gridColor}, beginAtZero:true}, y:{grid:{display:false}}}}});
  }

  const cGan = document.getElementById('chartGananciaCategoria');
  if(cGan){
    const desde = new Date(); desde.setDate(desde.getDate()-30);
    const ventasRecientes = state.ventas.filter(v=>v.estado!=='anulada' && new Date(v.fecha) >= desde);
    const idsRecientes = new Set(ventasRecientes.map(v=>v.id));
    const ganPorCat = {};
    state.ventaItems.forEach(it => {
      if(!idsRecientes.has(it.venta_id)) return;
      const prod = productoPorId(it.producto_id);
      const cat = prod ? nombreCategoria(prod.categoria_id) : 'Otros';
      const ganancia = (Number(it.precio_unitario||0) - Number(it.costo_unitario||0)) * Number(it.cantidad||0);
      ganPorCat[cat] = (ganPorCat[cat]||0) + ganancia;
    });
    const labels = Object.keys(ganPorCat);
    charts.cGan = new Chart(cGan, {type:'bar', data:{labels, datasets:[{label:'Ganancia', data:Object.values(ganPorCat), backgroundColor:success}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:gridColor}, beginAtZero:true}}}});
  }

  const cMes = document.getElementById('chartVentasMensual');
  if(cMes){
    const anio = state.reportesAnio || new Date().getFullYear();
    const resumen = calcularResumenMensual(anio);
    charts.cMes = new Chart(cMes, {type:'bar', data:{labels:resumen.map(f=>f.mes), datasets:[{label:'Ventas', data:resumen.map(f=>f.total), backgroundColor:neon2}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:gridColor}, beginAtZero:true}}}});
  }
}

function filtrarFilasPorTexto(tablaId, texto){
  const t = texto.trim().toLowerCase();
  $all(`#${tablaId} tbody tr`).forEach(tr => {
    const hay = tr.getAttribute('data-buscar') || '';
    tr.style.display = (!t || hay.includes(t)) ? '' : 'none';
  });
}
function cambiarFiltro(seccion, campo, valor){
  state.filtros[seccion][campo] = valor;
  render();
}

function actualizarDescuento(v){
  // Solo actualiza el estado y los totales en pantalla (sin re-render completo),
  // para no perder el foco del campo mientras se escribe.
  state.ventaForm.descuento = Number(v)||0;
  const subtotal = state.carrito.reduce((s,l)=>s+l.cantidad*l.precio_unitario,0);
  const descuento = Number(state.ventaForm.descuento)||0;
  const base = Math.max(0, subtotal-descuento);
  const ivaAplica = state.ajustes.iva_aplica === 'true';
  const ivaPct = Number(state.ajustes.iva_porcentaje)||0;
  const impuestos = ivaAplica ? Math.round(base*ivaPct/100) : 0;
  const total = base + impuestos;
  const elD = document.getElementById('lblCarritoDescuento'); if(elD) elD.textContent = '- '+fmtMoney(descuento);
  const elI = document.getElementById('lblCarritoImpuestos'); if(elI) elI.textContent = '+ '+fmtMoney(impuestos);
  const elT = document.getElementById('lblCarritoTotal'); if(elT) elT.textContent = fmtMoney(total);
}

function historialVentasHtml(esAdmin){
  const f = state.filtros.ventas;
  let lista = state.ventas.slice();
  if(f.desde) lista = lista.filter(v => v.fecha >= f.desde);
  if(f.hasta) lista = lista.filter(v => v.fecha <= f.hasta+'T23:59:59');
  if(f.estado) lista = lista.filter(v => v.estado === f.estado);

/* ---------- Reportes ---------- */
function aniosDisponibles(){
  const set = new Set(state.ventas.map(v => new Date(v.fecha).getFullYear()));
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a,b) => b-a);
}
function cambiarAnioReporte(v){ state.reportesAnio = Number(v); render(); }

function calcularResumenMensual(anio){
  const nombresMes = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const filas = nombresMes.map(nombre => ({ mes:nombre, ventas:0, unidades:0, total:0, costo:0, ganancia:0 }));
  const idVentaAMes = {};
  state.ventas.forEach(v => {
    if(v.estado==='anulada') return;
    const fecha = new Date(v.fecha);
    if(fecha.getFullYear() !== anio) return;
    const m = fecha.getMonth();
    idVentaAMes[v.id] = m;
    filas[m].ventas += 1;
    filas[m].total += Number(v.total||0);
    filas[m].costo += Number(v.costo_total||0);
    filas[m].ganancia += Number(v.ganancia||0);
  });
  state.ventaItems.forEach(it => {
    const m = idVentaAMes[it.venta_id];
    if(m === undefined) return;
    filas[m].unidades += Number(it.cantidad||0);
  });
  return filas;
}

function calcularResumenAnual(){
  const porAnio = {};
  state.ventas.forEach(v => {
    if(v.estado==='anulada') return;
    const anio = new Date(v.fecha).getFullYear();
    if(!porAnio[anio]) porAnio[anio] = { anio, ventas:0, total:0, costo:0, ganancia:0 };
    porAnio[anio].ventas += 1;
    porAnio[anio].total += Number(v.total||0);
    porAnio[anio].costo += Number(v.costo_total||0);
    porAnio[anio].ganancia += Number(v.ganancia||0);
  });
  return Object.values(porAnio).sort((a,b) => b.anio - a.anio);
}

function tabReportes(){
  const desde = $('#repDesde') ? $('#repDesde').value : inicioMesISO().slice(0,10);

    <div class="cards-grid" style="margin-bottom:16px;">

      <div class="card"><div class="kpi-label">Ganancia estimada</div><div class="kpi-value" style="color:var(--success)">${fmtMoney(gananciaAnio)}</div></div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Mes</th><th>Ventas</th><th>Unidades</th><th>Total</th><th>Ganancia</th></tr></thead>
        <tbody>
          ${resumenMensual.map(f=>`<tr><td>${f.mes}</td><td>${fmtNum(f.ventas)}</td><td>${fmtNum(f.unidades)}</td><td>${fmtMoney(f.total)}</td><td>${fmtMoney(f.ganancia)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>Comparativo anual</h3>
      <button class="btn" data-action="generar-reporte-anual">🖨️ Imprimir comparativo anual</button>

    <div class="table-wrap">

        <thead><tr><th>Año</th><th>Ventas</th><th>Total vendido</th><th>Ganancia</th></tr></thead>
        <tbody>
          ${resumenAnual.map(f=>`<tr><td>${f.anio}</td><td>${fmtNum(f.ventas)}</td><td>${fmtMoney(f.total)}</td><td>${fmtMoney(f.ganancia)}</td></tr>`).join('') || `<tr><td colspan="4" class="empty-state">Aún no hay ventas registradas.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>

    <h3>Inventario valorizado</h3>

      <table>

    <div class="panel-head"><h3>Respaldo de datos</h3></div>
    <div class="flex gap8 wrap">

function sugerirPrecioVenta(){
  const costo = Number($('#campoCosto').value)||0;
  const margen = margenSugeridoGlobal();
  const campoPrecio = $('#campoPrecioVenta');
  if(campoPrecio && (!campoPrecio.dataset.tocado || campoPrecio.dataset.tocado==='0')){
    campoPrecio.value = Math.round(costo * (1 + margen/100));
  }
}

async function guardarProducto(form){
  const fd = new FormData(form);
  const id = state.modal.id;
  const datos = {
    nombre: fd.get('nombre').trim(),
    sku: fd.get('sku').trim() || null,
    categoria_id: fd.get('categoria_id') || null,
    proveedor_id: fd.get('proveedor_id') || null,
    costo: Number(fd.get('costo'))||0,
    precio_venta: Number(fd.get('precio_venta'))||0,
    stock_minimo: Number(fd.get('stock_minimo'))||0,
    unidad: fd.get('unidad').trim() || 'unidad',
    estado: fd.get('estado'),
    notas: fd.get('notas').trim() || null,
  };
  if(!datos.nombre){ toast('El nombre es obligatorio.','error'); return; }

  const archivoInput = $('#campoImagenProducto');
  if(archivoInput && archivoInput.files && archivoInput.files[0]){
    const url = await subirImagen(archivoInput.files[0]);
    if(url) datos.imagen_url = url;
  }

  try{
    if(id){
      const { error } = await supa.from('productos').update(datos).eq('id', id);
      if(error) throw error;
      toast('Producto actualizado.','success');
    } else {
      datos.stock_actual = Number(fd.get('stock_actual'))||0;
      const { data, error } = await supa.from('productos').insert(datos).select().single();
      if(error) throw error;
      if(datos.stock_actual > 0){
        await supa.from('movimientos_inventario').insert({
          producto_id: data.id, tipo:'entrada', cantidad: datos.stock_actual, stock_resultante: datos.stock_actual,
          motivo:'Stock inicial', usuario: nombreUsuarioActual()
        });
      }
      toast('Producto creado.','success');
    }
    state.modal = null;
    await cargarDatos();
  }catch(err){
    console.error(err);
    toast('No se pudo guardar el producto.','error');
  }
}

async function agregarCategoriaRapida(){
  const nombre = prompt('Nombre de la nueva categoría:');
  if(!nombre || !nombre.trim()) return;
  try{
    const { data, error } = await supa.from('categorias').insert({ nombre: nombre.trim() }).select().single();
    if(error) throw error;
    state.categorias.push(data);
    state.categorias.sort((a,b) => a.nombre.localeCompare(b.nombre));
    const select = document.querySelector('#formProducto select[name="categoria_id"]');
    if(select){
      const opt = document.createElement('option');
      opt.value = data.id; opt.textContent = data.nombre; opt.selected = true;
      select.appendChild(opt);
    }
    toast('Categoría creada.','success');
  }catch(err){
    console.error(err);
    toast('No se pudo crear la categoría (¿ya existe ese nombre?).','error');
  }
}

async function eliminarProducto(id){
  if(!confirm('¿Eliminar este producto? Esta acción no se puede deshacer.')) return;
  const { error } = await supa.from('productos').delete().eq('id', id);

  toast('Producto eliminado.','success');

async function subirImagen(file){
  try{
    const ruta = `productos/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const { error } = await supa.storage.from(BUCKET_ARCHIVOS).upload(ruta, file, { upsert:true });
    if(error) throw error;
    const { data } = supa.storage.from(BUCKET_ARCHIVOS).getPublicUrl(ruta);
    return data.publicUrl;
  }catch(err){
    console.error(err);
    toast('No se pudo subir la imagen, se guardará el producto sin foto.','error');
    return null;
  }
}

function agregarAlCarrito(productoId){
  const p = productoPorId(productoId);
  if(!p) return;
  const existente = state.carrito.find(l=>l.producto_id===productoId);
  const enCarrito = existente ? existente.cantidad : 0;
  if(enCarrito + 1 > Number(p.stock_actual)){ toast('No hay suficiente stock disponible.','error'); return; }
  if(existente){ existente.cantidad += 1; }
  else{ state.carrito.push({ producto_id:p.id, nombre:p.nombre, precio_unitario:Number(p.precio_venta), costo_unitario:Number(p.costo), cantidad:1 }); }
  render();
}
function agregarInstalacionCarrito(){
  const val = window.prompt('Costo de la instalación (COP):', '0');
  if(val === null) return;
  const precio = Number(val);
  if(isNaN(precio) || precio < 0){ toast('Ingresa un valor numérico válido.','error'); return; }
  state.carrito.push({ producto_id:null, nombre:'Instalación', precio_unitario:precio, costo_unitario:0, cantidad:1 });
  render();
}
function cambiarCantidadCarrito(idx, delta){
  const linea = state.carrito[idx];
  if(!linea) return;
  const p = productoPorId(linea.producto_id);
  const nueva = linea.cantidad + delta;
  if(nueva <= 0){ state.carrito.splice(idx,1); render(); return; }
  if(p && nueva > Number(p.stock_actual)){ toast('No hay suficiente stock disponible.','error'); return; }
  linea.cantidad = nueva;
  render();
}
function quitarDelCarrito(idx){ state.carrito.splice(idx,1); render(); }

function nombreUsuarioActual(){
  if(state.modo==='admin') return state.vendedorNombre || 'Administrador';
  if(state.modo==='vendedor') return state.vendedorNombre || 'Vendedor';
  return 'Socio';
}

async function confirmarVenta(){
  if(!state.carrito.length){ toast('El carrito está vacío.','error'); return; }
  const subtotal = state.carrito.reduce((s,l)=>s+l.cantidad*l.precio_unitario,0);
  const descuento = Number(state.ventaForm.descuento)||0;
  const base = Math.max(0, subtotal-descuento);
  const ivaAplica = state.ajustes.iva_aplica === 'true';
  const ivaPct = Number(state.ajustes.iva_porcentaje)||0;
  const impuestos = ivaAplica ? Math.round(base * ivaPct/100) : 0;
  const total = base + impuestos;
  const costoTotal = state.carrito.reduce((s,l)=>s+l.cantidad*l.costo_unitario,0);
  const ganancia = base - costoTotal;

  try{
    for(const linea of state.carrito){
      if(!linea.producto_id) continue; // servicios como "Instalación" no afectan stock
      const p = productoPorId(linea.producto_id);
      if(!p || Number(p.stock_actual) < linea.cantidad){
        toast(`Stock insuficiente para ${linea.nombre}.`,'error');
        return;
      }
    }

    // Cliente opcional: si se escribió un nombre, se busca o se crea en Clientes automáticamente
    let clienteId = null;
    const nombreCliente = (state.ventaForm.cliente_nombre||'').trim();
    const telCliente = (state.ventaForm.cliente_telefono||'').trim();
    if(nombreCliente){
      const existente = state.clientes.find(c => (c.nombre||'').trim().toLowerCase() === nombreCliente.toLowerCase());
      if(existente){
        clienteId = existente.id;
        if(telCliente && !existente.telefono){
          await supa.from('clientes').update({ telefono: telCliente }).eq('id', existente.id);
        }
      }else{
        const { data: nuevoCliente, error: errCli } = await supa.from('clientes')
          .insert({ nombre: nombreCliente, telefono: telCliente || null }).select().single();
        if(!errCli && nuevoCliente) clienteId = nuevoCliente.id;
      }
    }

    const { data: venta, error: errV } = await supa.from('ventas').insert({
      cliente_nombre: nombreCliente || null,
      cliente_id: clienteId,
      vendedor: nombreUsuarioActual(),
      metodo_pago: state.ventaForm.metodo_pago,
      incluye_garantia: !!state.ventaForm.incluir_garantia,
      subtotal, descuento, impuestos, total, costo_total: costoTotal, ganancia, estado:'completada'
    }).select().single();
    if(errV) throw errV;

    for(const linea of state.carrito){
      await supa.from('venta_items').insert({
        venta_id: venta.id, producto_id: linea.producto_id, producto_nombre: linea.nombre,
        cantidad: linea.cantidad, precio_unitario: linea.precio_unitario, costo_unitario: linea.costo_unitario,
        subtotal: linea.cantidad*linea.precio_unitario
      });
      if(!linea.producto_id) continue; // servicios como "Instalación": sin stock que ajustar
      const p = productoPorId(linea.producto_id);
      const nuevoStock = Number(p.stock_actual) - linea.cantidad;
      await supa.from('productos').update({ stock_actual: nuevoStock }).eq('id', linea.producto_id);
      await supa.from('movimientos_inventario').insert({
        producto_id: linea.producto_id, tipo:'venta', cantidad: -linea.cantidad, stock_resultante: nuevoStock,
        referencia: `Venta #${venta.numero_venta}`, venta_id: venta.id, usuario: nombreUsuarioActual()
      });
    }
    toast(`Venta #${venta.numero_venta} registrada por ${fmtMoney(total)}.`,'success');
    state.carrito = [];
    state.ventaForm = { cliente_nombre:'', cliente_telefono:'', cliente_id:'', metodo_pago:'efectivo', descuento:0, notas:'', incluir_garantia:false };
    await cargarDatos();
  }catch(err){
    console.error(err);
    toast('No se pudo registrar la venta.','error');
  }
}

async function anularVenta(id){
  if(!confirm('¿Anular esta venta? El stock de los productos se repondrá.')) return;
  try{
    const venta = state.ventas.find(v=>v.id===id);
    const items = state.ventaItems.filter(it=>it.venta_id===id);
    for(const it of items){
      const p = productoPorId(it.producto_id);
      if(!p) continue;
      const nuevoStock = Number(p.stock_actual) + Number(it.cantidad);
      await supa.from('productos').update({ stock_actual: nuevoStock }).eq('id', p.id);
      await supa.from('movimientos_inventario').insert({
        producto_id: p.id, tipo:'devolucion', cantidad: Number(it.cantidad), stock_resultante: nuevoStock,
        referencia: `Anulación venta #${venta ? venta.numero_venta : ''}`, venta_id: id, usuario: nombreUsuarioActual()
      });
    }
    await supa.from('ventas').update({ estado:'anulada' }).eq('id', id);
    toast('Venta anulada y stock repuesto.','success');
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudo anular la venta.','error'); }
}

   ============================================================ */
async function registrarEntrada(form){
  const fd = new FormData(form);
  const productoId = fd.get('producto_id');
  const cantidad = Number(fd.get('cantidad'))||0;
  const costoUnitario = fd.get('costo_unitario') ? Number(fd.get('costo_unitario')) : null;
  const actualizarCosto = fd.get('actualizar_costo') === 'on';
  const referencia = fd.get('referencia').trim() || null;
  if(cantidad <= 0){ toast('La cantidad debe ser mayor a 0.','error'); return; }
  const p = productoPorId(productoId);
  if(!p) return;
  try{
    const nuevoStock = Number(p.stock_actual) + cantidad;
    const cambios = { stock_actual: nuevoStock };
    if(actualizarCosto && costoUnitario !== null) cambios.costo = costoUnitario;
    await supa.from('productos').update(cambios).eq('id', productoId);
    await supa.from('movimientos_inventario').insert({
      producto_id: productoId, tipo:'entrada', cantidad, stock_resultante: nuevoStock,
      motivo:'Compra a proveedor', referencia, proveedor_id: p.proveedor_id || null,
      costo_unitario: costoUnitario, usuario: nombreUsuarioActual()
    });
    toast('Entrada registrada.','success');
    state.modal = null;
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudo registrar la entrada.','error'); }
}

async function registrarAjuste(form){
  const fd = new FormData(form);
  const productoId = fd.get('producto_id');
  const tipo = fd.get('tipo');
  const cantidad = Number(fd.get('cantidad'))||0;
  const motivo = fd.get('motivo').trim();
  if(cantidad <= 0){ toast('La cantidad debe ser mayor a 0.','error'); return; }
  if(!motivo){ toast('El motivo es obligatorio.','error'); return; }
  const p = productoPorId(productoId);
  if(!p) return;
  const nuevoStock = Math.max(0, Number(p.stock_actual) - cantidad);
  try{
    await supa.from('productos').update({ stock_actual: nuevoStock }).eq('id', productoId);
    await supa.from('movimientos_inventario').insert({
      producto_id: productoId, tipo, cantidad: -cantidad, stock_resultante: nuevoStock, motivo, usuario: nombreUsuarioActual()
    });
    toast('Movimiento registrado.','success');
    state.modal = null;
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudo registrar el movimiento.','error'); }
}

/* ============================================================
   ACCIONES: AJUSTES DEL NEGOCIO
   ============================================================ */
async function guardarAjustesNegocio(form){
  const fd = new FormData(form);
  const claves = ['nombre_empresa','moneda','margen_sugerido_global','umbral_stock_bajo','iva_porcentaje'];
  try{
    for(const k of claves){
      await supa.from('ajustes').upsert({ key:k, value: String(fd.get(k)||'') });
    }
    await supa.from('ajustes').upsert({ key:'iva_aplica', value: fd.get('iva_aplica')==='on' ? 'true' : 'false' });
    toast('Ajustes guardados.','success');
    await cargarDatos();
  }catch(err){ console.error(err); toast('No se pudieron guardar los ajustes.','error'); }
}

/* ============================================================
   REPORTES / BACKUP
   ============================================================ */
function abrirVentanaReporte(titulo, subtitulo, cuerpoHtml){
  const w = window.open('', '_blank');
  if(!w){ toast('El navegador bloqueó la ventana del reporte. Permite ventanas emergentes para este sitio.','error'); return; }
  w.document.write(`
    <html><head><title>${esc(titulo)} — Lixus Company</title>
    <style>
      body{font-family:Arial,sans-serif;padding:30px;color:#111;}
      .doc-head{display:flex;align-items:center;gap:14px;}
      .doc-head img{height:56px;width:auto;filter:invert(1);}
      h1{margin-bottom:0;} .sub{color:#555;margin-top:4px;}
      table{width:100%;border-collapse:collapse;margin-top:18px;}
      th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:13px;}
      th{background:#eee;}
      .kpis{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;}
      .kpi{border:1px solid #ccc;padding:12px 16px;border-radius:6px;}
      .billto{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:14px;}
      .totals-right{justify-content:flex-end;}
      .legal{margin-top:24px;font-size:12px;color:#777;}
      .anulada{color:#c0392b;font-weight:bold;margin-top:10px;}
    </style></head><body>
    <div class="doc-head">
      <img src="${LOGO_DATA_URI}" alt="Lixus Company">
      <div><h1>${esc(titulo)}</h1>
      <p class="sub">${subtitulo} — Generado: ${new Date().toLocaleString('es-CO')}</p></div>
    </div>
    ${cuerpoHtml}
    </body></html>`);
  w.document.close();
}

function generarCotizacionImprimible(){
  if(!state.carrito.length){ toast('Agrega productos al carrito antes de generar una cotización.','error'); return; }
  const subtotal = state.carrito.reduce((s,l)=>s+l.cantidad*l.precio_unitario,0);
  const descuento = Number(state.ventaForm.descuento)||0;
  const base = Math.max(0, subtotal - descuento);
  const ivaAplica = state.ajustes.iva_aplica === 'true';
  const ivaPct = Number(state.ajustes.iva_porcentaje)||0;
  const impuestos = ivaAplica ? Math.round(base * ivaPct/100) : 0;
  const total = base + impuestos;
  const numeroCot = 'COT-' + Date.now().toString().slice(-8);

  const cuerpo = `
    <div class="billto">
      <div><strong>Cliente:</strong><br>${esc(state.ventaForm.cliente_nombre || 'Consumidor final')}${state.ventaForm.cliente_telefono ? '<br>'+esc(state.ventaForm.cliente_telefono) : ''}</div>
      <div style="text-align:right;"><strong>Válida por 8 días</strong></div>
    </div>
    <table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th></tr></thead>
    <tbody>${state.carrito.map(l=>`<tr><td>${esc(l.nombre)}</td><td>${l.cantidad}</td><td>${fmtMoney(l.precio_unitario)}</td><td>${fmtMoney(l.cantidad*l.precio_unitario)}</td></tr>`).join('')}</tbody></table>
    <div class="kpis totals-right">
      <div class="kpi"><strong>Subtotal</strong><br>${fmtMoney(subtotal)}</div>
      ${descuento ? `<div class="kpi"><strong>Descuento</strong><br>- ${fmtMoney(descuento)}</div>` : ''}
      ${ivaAplica ? `<div class="kpi"><strong>IVA (${ivaPct}%)</strong><br>${fmtMoney(impuestos)}</div>` : ''}
      <div class="kpi"><strong>Total</strong><br>${fmtMoney(total)}</div>
    </div>
    ${itemsIncluyenCategoria(state.carrito, 'Cámaras') ? `<p class="legal"><strong>Nota:</strong> el servicio técnico se cobra por aparte.</p>` : ''}
    ${state.ventaForm.incluir_garantia ? `<p class="legal"><strong>Garantía:</strong> aplica solo por defectos de fábrica o de instalación.</p>` : ''}
    <p class="legal">Este documento es una cotización informal, no descuenta inventario ni queda registrada en el sistema, y no constituye una factura electrónica. Precios sujetos a cambio sin previo aviso.</p>`;

  abrirVentanaReporte('Cotización', `N° ${numeroCot}`, cuerpo);
}

function generarFacturaImprimible(ventaId){
  const venta = state.ventas.find(v => v.id === ventaId);
  if(!venta) return;
  const items = state.ventaItems.filter(it => it.venta_id === ventaId);
  const cliente = venta.cliente_id ? state.clientes.find(c => c.id === venta.cliente_id) : null;

  const cuerpo = `
    <div class="billto">
      <div><strong>Cliente:</strong><br>${esc(venta.cliente_nombre || (cliente ? cliente.nombre : 'Consumidor final'))}${cliente && cliente.telefono ? '<br>'+esc(cliente.telefono) : ''}</div>
      <div style="text-align:right;"><strong>Vendedor:</strong> ${esc(venta.vendedor||'—')}<br><strong>Pago:</strong> ${esc(venta.metodo_pago||'—')}</div>
    </div>
    <table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th></tr></thead>
    <tbody>${items.map(it=>`<tr><td>${esc(it.producto_nombre)}</td><td>${fmtNum(it.cantidad)}</td><td>${fmtMoney(it.precio_unitario)}</td><td>${fmtMoney(it.subtotal)}</td></tr>`).join('')}</tbody></table>
    <div class="kpis totals-right">
      <div class="kpi"><strong>Subtotal</strong><br>${fmtMoney(venta.subtotal)}</div>
      ${Number(venta.descuento)>0 ? `<div class="kpi"><strong>Descuento</strong><br>- ${fmtMoney(venta.descuento)}</div>` : ''}
      ${Number(venta.impuestos)>0 ? `<div class="kpi"><strong>IVA</strong><br>${fmtMoney(venta.impuestos)}</div>` : ''}
      <div class="kpi"><strong>Total</strong><br>${fmtMoney(venta.total)}</div>
    </div>
    ${venta.estado==='anulada' ? `<p class="anulada">VENTA ANULADA</p>` : ''}
    ${itemsIncluyenCategoria(items, 'Cámaras') ? `<p class="legal"><strong>Nota:</strong> el servicio técnico se cobra por aparte.</p>` : ''}
    ${venta.incluye_garantia ? `<p class="legal"><strong>Garantía:</strong> aplica solo por defectos de fábrica o de instalación.</p>` : ''}
    <p class="legal">Factura de venta / comprobante interno. Este documento no constituye una factura electrónica ante la DIAN.</p>`;

  abrirVentanaReporte('Factura de venta', `Venta N° ${venta.numero_venta} · ${fmtDateTime(venta.fecha)}`, cuerpo);
}

function generarReporteImprimible(){
  const desde = $('#repDesde').value;
  const hasta = $('#repHasta').value;
  const ventas = state.ventas.filter(v => v.estado!=='anulada' && v.fecha.slice(0,10) >= desde && v.fecha.slice(0,10) <= hasta);
  const totalVentas = ventas.reduce((s,v)=>s+Number(v.total||0),0);
  const totalGanancia = ventas.reduce((s,v)=>s+Number(v.ganancia||0),0);
  const cantVendidos = {};
  ventas.forEach(v => {
    state.ventaItems.filter(it=>it.venta_id===v.id).forEach(it => {
      cantVendidos[it.producto_nombre] = (cantVendidos[it.producto_nombre]||0) + Number(it.cantidad||0);
    });
  });
  const topProductos = Object.entries(cantVendidos).sort((a,b)=>b[1]-a[1]).slice(0,15);

  const cuerpo = `
    <div class="kpis">
      <div class="kpi"><strong>Ventas totales</strong><br>${fmtMoney(totalVentas)}</div>
      <div class="kpi"><strong>Ganancia estimada</strong><br>${fmtMoney(totalGanancia)}</div>
      <div class="kpi"><strong># de ventas</strong><br>${ventas.length}</div>
    </div>
    <h3>Productos más vendidos</h3>
    <table><thead><tr><th>Producto</th><th>Unidades vendidas</th></tr></thead>
    <tbody>${topProductos.map(([n,c])=>`<tr><td>${esc(n)}</td><td>${c}</td></tr>`).join('') || '<tr><td colspan=2>Sin ventas en el periodo.</td></tr>'}</tbody></table>
    <h3>Detalle de ventas</h3>
    <table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Total</th></tr></thead>
    <tbody>${ventas.map(v=>`<tr><td>${v.numero_venta}</td><td>${new Date(v.fecha).toLocaleString('es-CO')}</td><td>${esc(v.cliente_nombre||'Consumidor final')}</td><td>${esc(v.vendedor||'')}</td><td>${fmtMoney(v.total)}</td></tr>`).join('') || '<tr><td colspan=5>Sin ventas.</td></tr>'}</tbody></table>`;

  abrirVentanaReporte('Reporte de ventas', `Periodo: ${esc(desde)} a ${esc(hasta)}`, cuerpo);
}

function generarReporteMensualImprimible(){
  const anio = state.reportesAnio || new Date().getFullYear();
  const filas = calcularResumenMensual(anio);
  const totalAnio = filas.reduce((s,f)=>s+f.total,0);
  const gananciaAnio = filas.reduce((s,f)=>s+f.ganancia,0);
  const ventasAnio = filas.reduce((s,f)=>s+f.ventas,0);

  const cuerpo = `
    <div class="kpis">
      <div class="kpi"><strong>Total vendido en ${anio}</strong><br>${fmtMoney(totalAnio)}</div>
      <div class="kpi"><strong>Ganancia estimada</strong><br>${fmtMoney(gananciaAnio)}</div>
      <div class="kpi"><strong># de ventas</strong><br>${ventasAnio}</div>
    </div>
    <table><thead><tr><th>Mes</th><th>Ventas</th><th>Unidades</th><th>Total</th><th>Ganancia</th></tr></thead>
    <tbody>${filas.map(f=>`<tr><td>${f.mes}</td><td>${f.ventas}</td><td>${f.unidades}</td><td>${fmtMoney(f.total)}</td><td>${fmtMoney(f.ganancia)}</td></tr>`).join('')}</tbody></table>`;

  abrirVentanaReporte(`Informe mensual ${anio}`, `Año ${anio}`, cuerpo);
}

function generarReporteAnualImprimible(){
  const filas = calcularResumenAnual();
  const cuerpo = `
    <table><thead><tr><th>Año</th><th>Ventas</th><th>Total vendido</th><th>Ganancia</th></tr></thead>
    <tbody>${filas.map(f=>`<tr><td>${f.anio}</td><td>${f.ventas}</td><td>${fmtMoney(f.total)}</td><td>${fmtMoney(f.ganancia)}</td></tr>`).join('') || '<tr><td colspan=4>Sin ventas registradas.</td></tr>'}</tbody></table>`;

  abrirVentanaReporte('Comparativo anual', 'Todos los años registrados', cuerpo);
}

function exportarBackup(){
  const backup = {
    generado: new Date().toISOString(),
    categorias: state.categorias, proveedores: state.proveedores, productos: state.productos,
    clientes: state.clientes, ventas: state.ventas, venta_items: state.ventaItems,
    movimientos_inventario: state.movimientos, ajustes: state.ajustes
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `lixus-backup-${hoyISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exportado.','success');
}

async function importarBackup(file){
  if(!file) return;
  if(!confirm('Importar reemplazará los datos actuales por los del archivo. ¿Continuar?')) return;
  try{
    const texto = await file.text();
    const data = JSON.parse(texto);
    const tablas = ['categorias','proveedores','productos','clientes','ventas','venta_items','movimientos_inventario'];
    for(const t of tablas){
      if(Array.isArray(data[t]) && data[t].length){
        await supa.from(t).upsert(data[t]);
      }
    }
    toast('Backup importado correctamente.','success');
    await cargarDatos();
  }catch(err){ console.error(err); toast('El archivo no es un backup válido.','error'); }
}

/* ============================================================
   DELEGACIÓN DE EVENTOS
   ============================================================ */
function cerrarModal(){ state.modal = null; render(); }

document.addEventListener('DOMContentLoaded', () => {
  const app = $('#app');

  app.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const accion = btn.dataset.action;
    const id = btn.dataset.id;

    if(accion==='ir-tab'){ state.tab = id; state.ventaExpandida=null; render(); }
    else if(accion==='toggle-tema'){ state.tema = state.tema==='dark' ? 'light' : 'dark'; render(); }
    else if(accion==='recargar'){ cargarDatos(); }
    else if(accion==='cerrar-sesion'){ state.autenticado=false; state.carrito=[]; state.tab='dashboard'; render(); }
    else if(accion==='cerrar-modal'){ cerrarModal(); }
    else if(accion==='cerrar-modal-fondo'){ if(e.target===btn){ cerrarModal(); } }
    else if(accion==='nuevo-producto'){ state.modal={tipo:'producto', id:null}; render(); }
    else if(accion==='editar-producto'){ state.modal={tipo:'producto', id}; render(); }
    else if(accion==='nueva-categoria'){ agregarCategoriaRapida(); }
    else if(accion==='eliminar-producto'){ eliminarProducto(id); }
    else if(accion==='nuevo-proveedor'){ state.modal={tipo:'proveedor', id:null}; render(); }
    else if(accion==='editar-proveedor'){ state.modal={tipo:'proveedor', id}; render(); }
    else if(accion==='eliminar-proveedor'){ eliminarProveedor(id); }
    else if(accion==='nuevo-cliente'){ state.modal={tipo:'cliente', id:null}; render(); }
    else if(accion==='editar-cliente'){ state.modal={tipo:'cliente', id}; render(); }
    else if(accion==='eliminar-cliente'){ eliminarCliente(id); }
    else if(accion==='nueva-entrada'){ state.modal={tipo:'entrada'}; render(); }
    else if(accion==='nuevo-ajuste'){ state.modal={tipo:'ajuste'}; render(); }
    else if(accion==='agregar-carrito'){ agregarAlCarrito(id); }
    else if(accion==='agregar-instalacion'){ agregarInstalacionCarrito(); }
    else if(accion==='carrito-mas'){ cambiarCantidadCarrito(Number(id), 1); }
    else if(accion==='carrito-menos'){ cambiarCantidadCarrito(Number(id), -1); }
    else if(accion==='carrito-quitar'){ quitarDelCarrito(Number(id)); }
    else if(accion==='confirmar-venta'){ confirmarVenta(); }
    else if(accion==='generar-cotizacion'){ generarCotizacionImprimible(); }
    else if(accion==='generar-factura'){ generarFacturaImprimible(id); }
    else if(accion==='ver-venta'){ state.ventaExpandida = state.ventaExpandida===id ? null : id; render(); }
    else if(accion==='anular-venta'){ anularVenta(id); }
    else if(accion==='generar-reporte'){ generarReporteImprimible(); }
    else if(accion==='generar-reporte-mensual'){ generarReporteMensualImprimible(); }
    else if(accion==='generar-reporte-anual'){ generarReporteAnualImprimible(); }
    else if(accion==='exportar-backup'){ exportarBackup(); }
    else if(accion==='copiar-link'){
      navigator.clipboard.writeText(id).then(()=>toast('Link copiado.','success')).catch(()=>toast('No se pudo copiar.','error'));
    }
  });

  app.addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    if(form.id === 'formLogin'){
      const pass = $('#inputPassword').value;
      if(pass) intentarLogin(pass);
    }
    else if(form.id === 'formNombreVendedor'){
      const nombre = $('#inputNombreVendedor').value.trim();
      state.vendedorNombre = nombre || (state.modo === 'admin' ? 'Administrador' : 'Vendedor');
      state.pidiendoNombreVendedor = false;
      render();
    }
    else if(form.id === 'formProducto') guardarProducto(form);
    else if(form.id === 'formProveedor') guardarProveedor(form);
    else if(form.id === 'formCliente') guardarCliente(form);
    else if(form.id === 'formEntrada') registrarEntrada(form);
    else if(form.id === 'formAjuste') registrarAjuste(form);
    else if(form.id === 'formAjustes') guardarAjustesNegocio(form);
  });

  app.addEventListener('input', (e) => {
    if(e.target.id === 'campoPrecioVenta'){ e.target.dataset.tocado = '1'; }
  });

  const favicon = document.createElement('link');
  favicon.rel = 'icon';
  favicon.href = LOGO_DATA_URI;
  document.head.appendChild(favicon);

  state.modo = detectarModo();
  render();
});
</script>
